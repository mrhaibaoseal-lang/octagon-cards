name: OctagonCards
options:
  bundleIdPrefix: com.mrhai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OctagonCore:
    path: Packages/OctagonCore
targets:
  OctagonCards:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: data/fighters.json
        buildPhase: resources
    dependencies:
      - package: OctagonCore
        product: FightEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Octagon Cards
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhai.octagoncards
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
