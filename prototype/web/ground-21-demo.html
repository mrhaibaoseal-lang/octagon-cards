<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地面 21 點草圖</title>
<style>
/* 地面「21 點」草圖 v2（格鬥轉播風）：只畫畫面，不接引擎。數字是範例。
   預設：五個畫面直排，每個 844×390。網址加 #f1 … #f5 或 ?f=1…5 只顯示單一畫面（截圖用）。
   選手圖來自 gitignore 的 assets/private；沒有時用色塊假人。 */
:root{
  --bg:#0a0d12; --panel:#141923; --line:#283042; --text:#f1f4f9; --dim:#8d97aa;
  --blue:#4c8dff; --red:#f0524f; --gold:#f5c542; --green:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#040507;color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{padding:16px 0 40px}
.shot{width:844px;margin:0 auto 22px}
.shot h3{font-size:14px;margin:0 0 6px;color:#cfd7e6}
.shot h3 small{font-weight:400;color:var(--dim);margin-left:8px;font-size:12px}
body.solo{padding:0}
body.solo .shot:not(.pick){display:none}
body.solo .shot.pick h3{display:none}
body.solo .shot.pick{margin:0}

.frame{position:relative;width:844px;height:390px;background:var(--bg);overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.frame::before{content:"";position:absolute;inset:0;background:
  radial-gradient(42% 46% at 50% 56%,#2b3653 0%,transparent 72%),
  radial-gradient(40% 34% at 0% 0%,#1d3a7a66 0%,transparent 70%),
  radial-gradient(40% 34% at 100% 0%,#7a1d1d66 0%,transparent 70%),
  linear-gradient(#0b0f17,#06080c)}
.frame>*{position:absolute}
.you{--c:var(--blue)} .foe{--c:var(--red)}

/* 上方：轉播計分條 */
.sb{top:0;height:42px;width:300px;display:flex;align-items:center;gap:8px;padding:0 10px}
.sb.you{left:0;background:linear-gradient(90deg,#16346e,#16346e00)}
.sb.foe{right:0;flex-direction:row-reverse;background:linear-gradient(270deg,#6e1a18,#6e1a1800)}
.face{width:34px;height:34px;border-radius:6px;background:color-mix(in srgb,var(--c) 45%,#10141c);box-shadow:0 0 0 2px var(--c);overflow:hidden;flex:none}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.nmx{line-height:1.15}.sb.foe .nmx{text-align:right}
.nmx b{display:block;font-size:15px;font-weight:800;letter-spacing:.06em;font-style:italic}
.nmx small{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--c) 60%,#fff)}
.hp{min-width:40px;height:30px;line-height:30px;text-align:center;font-size:19px;font-weight:800;border-radius:8px;background:linear-gradient(#e2574c,#a52c25);box-shadow:0 2px 0 #5d1410;flex:none}
.mid{left:300px;width:244px;top:3px;text-align:center;line-height:1.2}
.mid b{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;background:#f5c542;color:#1d1500;padding:1px 10px;border-radius:4px;transform:skewX(-10deg)}
.mid span{display:block;font-size:12px;color:#cfd7e6;margin-top:3px}

/* 位置三層 */
.lad{left:212px;width:420px;top:53px;height:30px;display:flex;gap:3px}
.lad div{flex:1;transform:skewX(-12deg);background:#151b27;border:1px solid var(--line);color:#6f7a90;font-size:12px;font-weight:700;text-align:center;line-height:28px;position:relative}
.lad div>*{display:inline-block;transform:skewX(12deg)}
.lad div u{text-decoration:none;font-weight:400;margin-left:4px}
.lad .out{flex:.8;border-style:dashed}
.lad .on{background:linear-gradient(#f5c542,#c98f0c);border-color:#ffe08a;color:#1d1500}
.lad .was{border-style:dashed;border-color:#8d97aa;color:#aab4c7}
.lad .tag{position:absolute;right:2px;top:-9px;font-size:10px;line-height:14px;padding:0 6px;border-radius:7px;background:#fff;color:#111;font-weight:800}

/* 兩側：自己與對手的牌 */
.side{top:90px;width:268px;height:226px;padding:8px 10px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#10141d),#0e121a);border:1px solid color-mix(in srgb,var(--c) 45%,#283042)}
.side.you{left:10px;border-left:4px solid var(--c)}
.side.foe{right:10px;border-right:4px solid var(--c)}
.side h4{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.side h4 i{font-style:normal;font-size:11px;padding:0 7px;line-height:17px;border-radius:4px;background:var(--c);color:#fff}
.side h4 small{font-weight:400;color:var(--dim);font-size:11px;margin-left:auto}
.cards{display:flex;gap:5px;height:62px;align-items:center}
.card{position:relative;width:42px;height:60px;border-radius:6px;flex:none;
  background:linear-gradient(160deg,#2a3246,#161b27);border:1px solid #55617c;border-top:5px solid var(--c);
  color:#fff;font-size:28px;font-weight:800;font-style:italic;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0009}
.card.down{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 38%,#10141c) 0 5px,color-mix(in srgb,var(--c) 20%,#10141c) 5px 10px);color:#ffffffcc;font-style:normal}
.card.new{box-shadow:0 0 0 2px var(--gold),0 2px 0 #0009}
.card.new::after{content:"新";position:absolute;top:-11px;right:-6px;font-size:10px;font-weight:800;font-style:normal;background:var(--gold);color:#251c00;border-radius:7px;padding:0 5px;line-height:14px}
.card.hide::after{content:"蓋著";position:absolute;bottom:2px;left:2px;right:2px;font-size:10px;font-weight:700;font-style:normal;color:#dfe6f3;background:#000a;border-radius:3px;line-height:13px;text-align:center}
.bonus{width:38px;height:60px;border-radius:6px;border:2px dashed var(--gold);color:var(--gold);font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:none}
.bonus small{font-size:9.5px;font-weight:700}

/* 總和：大數字＋量條（刻度到爆牌線） */
.sum{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.sum b{font-size:34px;font-weight:800;font-style:italic;line-height:1}
.sum b.q{font-size:28px;color:#c3ccdb}
.sum b.win{color:var(--gold)} .sum b.bad{color:var(--red)}
.sum span{font-size:12px;color:var(--dim)}
.sum em{font-style:normal;margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;background:#1c2331;color:#aab4c7}
.sum em.v22{background:#143a2d;color:var(--green);box-shadow:0 0 0 1px var(--green)}
.sum em.over{background:#4a1a19;color:#ff9d9b;box-shadow:0 0 0 1px var(--red)}
.gauge{position:relative;height:12px;margin-top:5px;background:#0b0e14;border:1px solid #2d3649;border-radius:3px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 60%,#000),var(--c));border-radius:2px}
.gauge .unk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffffff38 0 4px,transparent 4px 8px)}
.gauge .bust{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ff5b57}
.gauge .red{position:absolute;right:0;top:0;bottom:0;background:#ff5b5733}
.gauge .th{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--gold);box-shadow:0 0 0 1px #000}
.gl{position:relative;height:14px;font-size:10px;color:var(--dim)}
.gl i{position:absolute;top:1px;font-style:normal;transform:translateX(-50%);white-space:nowrap}
.gl i.b{color:#ff8f8b}.gl i.t{color:var(--gold);font-weight:700}

/* 對手的規則（真實數字）與場上的牌 */
.tell{margin-top:4px;padding:3px 8px;border-radius:6px;background:#241d06;border:1px solid #6a5310;font-size:12px;line-height:20px;white-space:nowrap;overflow:hidden}
.tell b{font-size:17px;font-weight:800;font-style:italic;color:var(--gold)}
.tell small{font-size:10.5px;color:#c9b77a;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chips span{font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;background:#2a2410;border:1px solid #7a6114;color:var(--gold);font-weight:700}
.chips span u{text-decoration:none;font-weight:400;color:#e6d9a8;margin-left:4px}
.chips span.none{background:none;border:1px dashed #3a4459;color:#6f7a90;font-weight:400}
.say1{margin-top:7px;font-size:11.5px;color:#aab4c7;line-height:1.4}
.say1 b{color:var(--gold)}

/* 中間：八角籠與兩位選手 */
.cage{left:284px;width:276px;top:88px;height:228px}
.mat{position:absolute;left:8px;right:8px;bottom:26px;height:92px;clip-path:polygon(22% 0,78% 0,100% 30%,100% 70%,78% 100%,22% 100%,0 70%,0 30%);
  background:radial-gradient(closest-side,#4a5674,#262f45 75%,#1a2133)}
.mat::after{content:"";position:absolute;inset:5px;clip-path:polygon(22% 0,78% 0,100% 30%,100% 70%,78% 100%,22% 100%,0 70%,0 30%);background:radial-gradient(closest-side,#394562,#222a3e 80%)}
.fence{position:absolute;left:30px;right:30px;bottom:110px;height:46px;opacity:.5;
  background:repeating-linear-gradient(60deg,#5a678844 0 1px,transparent 1px 9px),repeating-linear-gradient(-60deg,#5a678844 0 1px,transparent 1px 9px);border-top:3px solid #3a4560;border-radius:3px}
.fz{position:absolute;bottom:48px;height:150px;display:flex;align-items:flex-end;justify-content:center;width:150px}
.fz img{max-height:150px;max-width:190px;image-rendering:pixelated}
.fz.flip img,.fz.flip .dm{transform:scaleX(-1)}
.fz .dm{display:none;border-radius:16px;background:linear-gradient(var(--c) 40%,color-mix(in srgb,var(--c) 45%,#000) 40%)}
.fz.noimg img{display:none}.fz.noimg .dm{display:block}
.fz.up .dm{width:46px;height:96px;transform:rotate(38deg) translateY(10px)}
.fz.dn .dm{width:110px;height:34px}
.cap{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12.5px;color:#dfe6f3;line-height:1.3}
.cap b{color:var(--gold)} .cap.red b{color:#ff7a76}
.roleU,.roleD{position:absolute;top:2px;font-size:11px;font-weight:800;padding:0 8px;line-height:18px;border-radius:4px;background:var(--c);color:#fff;transform:skewX(-10deg)}
.stamp{position:absolute;left:50%;top:58px;transform:translateX(-50%) rotate(-8deg);border:3px solid var(--red);color:#ff7a76;font-size:30px;font-weight:800;letter-spacing:.12em;background:#2a0e0dd9;padding:0 14px;border-radius:8px;white-space:nowrap;z-index:3}
.stamp.good{border-color:var(--green);color:#6df0b4;background:#0b2118d9}
.stamp.gold{border-color:var(--gold);color:var(--gold);background:#2a2208d9}

/* 下方：操作 */
.act{left:150px;width:544px;top:322px;height:60px;display:flex;gap:10px}
.btn{flex:1;border-radius:8px;border:0;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;text-align:center;box-shadow:0 3px 0 #0009;transform:skewX(-6deg)}
.btn>*{transform:skewX(6deg)}
.btn b{font-size:20px;font-weight:800;letter-spacing:.06em}.btn small{font-size:12px;opacity:.9}
.btn.hit{background:linear-gradient(#e2574c,#a52c25)}
.btn.stand{background:linear-gradient(#566178,#394358)}
.btn.cash{background:linear-gradient(#e9b52f,#b27a0c);color:#241a00}
.btn.deep{background:linear-gradient(#e2574c,#8f1f1a)}
.btn.go{background:linear-gradient(#4c8dff,#2c5fcf)}
.note{top:326px;width:130px;font-size:11px;color:var(--dim);line-height:1.4}
.note.l{left:12px}.note.r{right:12px;text-align:right}
</style>
</head>
<body>
<script>
// 草圖資料：五個靜態畫面。這裡沒有規則邏輯，數字都是寫死的範例。
const P = "assets/private/";
const F = { mak: { id: "makhachev", name: "MAKHACHEV" }, poi: { id: "poirier", name: "POIRIER" } };
const SCALE = 24; // 量條畫到 24
const pc = (n) => (n / SCALE * 100).toFixed(1) + "%";

function cards(list, bonus) {
  return `<div class="cards">${list.map((c) => {
    const [v, k] = String(c).split(":");
    return v === "?" ? `<div class="card down">?</div>` : `<div class="card ${k || ""}">${v}</div>`;
  }).join("")}${bonus ? `<div class="bonus">+${bonus}<small>地面技</small></div>` : ""}</div>`;
}
// g: { known, unk (未知那張 1~10 的範圍), bust (21/22), th (對手門檻), cls, text, tag }
function sum(g) {
  const big = g.unk ? `<b class="q">${g.known}＋？</b>` : `<b class="${g.cls || ""}">${g.known}</b>`;
  const tagCls = g.over ? "over" : g.bust === 22 ? "v22" : "";
  const fill = Math.min(g.known, SCALE);
  return `<div class="sum">${big}<span>${g.text || ""}</span><em class="${tagCls}">${g.tag || "爆牌線 " + g.bust}</em></div>
  <div class="gauge"><div class="red" style="left:${pc(g.bust)}"></div><div class="fill" style="width:${pc(fill)}"></div>
    ${g.unk ? `<div class="unk" style="left:${pc(g.known + 1)};width:${pc(Math.min(9, SCALE - g.known - 1))}"></div>` : ""}
    <div class="bust" style="left:${pc(g.bust)}"></div>${g.th ? `<div class="th" style="left:${pc(g.th)}"></div>` : ""}</div>
  <div class="gl">${g.th ? `<i class="t" style="left:${pc(g.th)}">${g.th}</i>` : ""}<i class="b" style="left:${pc(g.bust)}">爆 ${g.bust}</i></div>`;
}
const chips = (list) => `<div class="chips">${list.length ? list.map(([n, d]) => `<span>${n}<u>${d}</u></span>`).join("") : `<span class="none">沒有地面牌</span>`}</div>`;

function frame(d) {
  const you = F[d.you], foe = F[d.foe], youTop = d.role === "top";
  const lad = ["站起來", "半防守", "側壓", "騎乘"].map((n, i) => {
    const mul = ["", "×1", "×2", "×4"][i], cls = i === d.layer ? "on" : i === d.was ? "was" : "";
    const tag = i === d.layer ? `<span class="tag">${d.layerTag || "現在"}</span>` : i === d.was ? `<span class="tag" style="background:#8d97aa">原本</span>` : "";
    return `<div class="${i ? cls : "out " + cls}"><span>${n}<u>${mul}</u></span>${tag}</div>`;
  }).join("");
  const top = youTop ? you : foe, bot = youTop ? foe : you;
  // 你永遠在左（藍角），對手在右（紅角）；上位那個人疊在上面
  const fz = (f, who, pose, cls, x) => `<div class="fz ${who} ${cls}" style="left:${x}px"><img src="${P}${f.id}/${pose}.png" alt="" onerror="this.parentNode.classList.add('noimg')"><div class="dm"></div></div>`;
  const stage = d.standing
    ? fz(you, "you", "idle", "up", 20) + fz(foe, "foe", "idle", "up flip", 106)
    : youTop
      ? fz(bot, "foe", "down", "dn flip", 86) + fz(top, "you", "shoot", "up", 40)
      : fz(bot, "you", "down", "dn", 40) + fz(top, "foe", "shoot", "up flip", 86);
  return `<section class="shot" id="${d.id}"><h3>${d.title}<small>${d.sub}</small></h3><div class="frame">
    <div class="sb you"><div class="face"><img src="${P}${you.id}/portrait.png" alt="" onerror="this.remove()"></div><div class="nmx"><b>${you.name}</b><small>你・${youTop ? "上位" : "下位"}</small></div><span class="hp">${d.hp[0]}</span></div>
    <div class="sb foe"><div class="face"><img src="${P}${foe.id}/portrait.png" alt="" onerror="this.remove()"></div><div class="nmx"><b>${foe.name}</b><small>對手・${youTop ? "下位" : "上位"}</small></div><span class="hp">${d.hp[1]}</span></div>
    <div class="mid"><b>R2　GROUND</b><span>${d.head}</span></div>
    <div class="lad">${lad}</div>
    <div class="side you"><h4><i>你</i>${youTop ? "上位・壓制" : "下位・掙脫"}<small>${d.me.left || ""}</small></h4>${cards(d.me.cards, d.me.bonus)}${sum(d.me.sum)}${chips(d.me.chips)}${d.me.say ? `<div class="say1">${d.me.say}</div>` : ""}</div>
    <div class="cage"><div class="fence"></div><div class="mat"></div>${stage}${d.stamp ? `<div class="stamp ${d.stamp[1] || ""}">${d.stamp[0]}</div>` : ""}<div class="cap ${d.capCls || ""}">${d.cap}</div></div>
    <div class="side foe"><h4><i>他</i>${youTop ? "下位・掙脫" : "上位・壓制"}<small>${d.him.left || ""}</small></h4>${cards(d.him.cards, d.him.bonus)}${sum(d.him.sum)}${d.him.tell ? `<div class="tell">他${d.him.tell[1]}<small>${d.him.tell[2]}</small></div>` : ""}${chips(d.him.chips)}</div>
    ${d.noteL ? `<div class="note l">${d.noteL}</div>` : ""}${d.noteR ? `<div class="note r">${d.noteR}</div>` : ""}
    <div class="act">${d.btns.map(([c, b, s]) => `<button class="btn ${c}"><b>${b}</b><small>${s}</small></button>`).join("")}</div>
  </div></section>`;
}

const GS = [["地面技 ×1", "起手 +1"]], SUB = ["降伏", "20 也算降伏"], UP = ["起身", "爆牌線 22"];
const FRAMES = [
  { id: "f1", title: "1　上位・加壓或穩住", sub: "要牌＝加壓，收手＝穩住。雙方各蓋 1 張；對手的門檻是真實數字，畫在他的量條上",
    you: "mak", foe: "poi", role: "top", hp: [38, 41], layer: 1, head: "你在上位，你先決定",
    me: { cards: [7, "6:hide"], bonus: 1, left: "還能要 3 張", sum: { known: 14, bust: 21, text: "壓制" }, chips: [...GS, SUB] },
    him: { cards: ["?", 8], left: "之後才動", sum: { known: 8, unk: true, bust: 21, th: 15, text: "掙脫" }, tell: [15, "低於 <b>15</b> 會再掙扎", "真實數字 ±1"], chips: [] },
    cap: "半防守：壓得越接近 21 越穩，<b>超過就被他滑出去</b>",
    btns: [["hit", "加壓", "要牌・再抽 1 張"], ["stand", "穩住", "收手・停在 14"]] },
  { id: "f2", title: "2　上位・壓住了：砸下去，還是過腿往深一層", sub: "兌現＝砸下去；再賭＝過腿到下一層再比一手，輸了全沒",
    you: "mak", foe: "poi", role: "top", hp: [38, 41], layer: 2, head: "20 對 15　你壓住了",
    me: { cards: [7, 6, "6:new"], bonus: 1, left: "已收手", sum: { known: 20, bust: 21, cls: "win", text: "壓制", tag: "贏 5" }, chips: [...GS, SUB] },
    him: { cards: [8, 7], left: "已收手", sum: { known: 15, bust: 21, text: "掙脫", tag: "輸 5" }, chips: [] },
    stamp: ["壓住了", "gold"], cap: "差距 5 ÷2 進位 <b>3</b> × 側壓 <b>2</b> ＝ <b>6</b>",
    noteL: "傷害上限 12。剛好 21 且他不是 21＝降伏，傷害 10", noteR: "到了騎乘只能砸，不能再過腿",
    btns: [["cash", "砸下去　打他 6", "兌現・結束這段地面"], ["deep", "過腿　→ 騎乘 ×4", "再賭一手・輸了全沒、站起來"]] },
  { id: "f3", title: "3　下位・掙扎或撐住", sub: "他已經穩住；你看不到他蓋著的那張。你有「起身」牌，爆牌線是 22",
    you: "poi", foe: "mak", role: "bot", hp: [41, 38], layer: 2, head: "你被壓在下位，輪到你",
    me: { cards: [9, "5:hide"], left: "還能要 3 張", sum: { known: 14, bust: 22, text: "掙脫" }, chips: [UP] },
    him: { cards: ["?", 9, "4:new"], bonus: 1, left: "已收手", sum: { known: 14, unk: true, bust: 21, th: 16, text: "壓制" }, tell: [16, "低於 <b>16</b> 會再加壓", "他停了＝約 16 以上"], chips: GS },
    cap: "側壓：你的總和<b>贏過他</b>才能脫出一層",
    btns: [["hit", "掙扎", "要牌・再抽 1 張"], ["stand", "撐住", "收手・停在 14"]] },
