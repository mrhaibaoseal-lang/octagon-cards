[project]
name = "octagon-pipeline"
version = "0.1.0"
description = "Octagon Cards UFC Scraper, Bayesian/Elo Rating Engine, and Cutout Pixelator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py311"
